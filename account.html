<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liftly — Create account</title><link rel="stylesheet" href="/portal.css"><style>body{background:#f7f5ef;color:#1b1930}.account-page{min-height:100vh;display:grid;place-items:center;padding:40px 20px}.account-box{width:min(100%,460px);background:#fff;padding:38px;box-shadow:18px 18px 0 #ded7f4}.logo{font-weight:800;font-size:22px;text-decoration:none;color:#1b1930}.logo span{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:9px;background:#1b1930;color:#cbff50;margin-right:5px}.account-box h1{font-size:48px;line-height:.95;letter-spacing:-3px;margin:38px 0 10px}.account-box>p{font-size:12px;color:#716c7b;line-height:1.6;margin-bottom:25px}.field{margin:14px 0}.field label{display:block;font-size:10px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #d8d4cf;font:12px Manrope;outline:0}.field input:focus{border-color:#8875c6}.create{width:100%;border:0;background:#1b1930;color:#fff;padding:14px;font:700 12px Manrope;cursor:pointer;margin-top:8px}.hint{font-size:9px;color:#8b8691;text-align:center;margin-top:16px}.back{display:block;text-align:center;margin-top:18px;font-size:11px;color:#1b1930}.status{font:10px 'DM Mono';margin-top:12px;min-height:14px}.ok{color:#4e8c34}.bad{color:#b34b57}</style></head><body><main class="account-page"><section class="account-box"><a class="logo" href="/"><span>l</span>Liftly</a><h1>Create your account.</h1><p>Build your private product portfolio, save winning products, track research signals, and keep your dropshipping workflow in one place.</p><form id="createAccount"><div class="field"><label>NAME</label><input id="name" required placeholder="Your name"></div><div class="field"><label>EMAIL</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>PASSWORD</label><input id="password" type="password" minlength="6" required placeholder="At least 6 characters"></div><button class="create">Create account →</button><div id="status" class="status"></div></form><div class="hint">Your local demo account is stored by Liftly. Live authentication can be enabled with the server environment.</div><a class="back" href="/">← Back to Liftly</a></section></main><script>const f=document.getElementById('createAccount'),s=document.getElementById('status');f.addEventListener('submit',async e=>{e.preventDefault();s.textContent='Creating account…';s.className='status';const body={name:name.value.trim(),email:email.value.trim(),password:password.value};try{const r=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Could not create account.');localStorage.setItem('liftlyUser',JSON.stringify(j.user||body));s.textContent='Account created. Opening your portfolio…';s.className='status ok';setTimeout(()=>location.href='/portfolio.html',500)}catch(err){localStorage.setItem('liftlyUser',JSON.stringify({name:body.name,email:body.email,plan:'Starter'}));s.textContent='Account created locally. Opening your portfolio…';s.className='status ok';setTimeout(()=>location.href='/portfolio.html',500)}});</script></body></html>
